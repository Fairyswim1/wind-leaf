<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>윈드 리프 · 나의 여행 노트</title><link rel="icon" href="../assets/reward.png"><link rel="stylesheet" href="../theme/fonts.css"><link rel="stylesheet" href="../vendor/katex/katex.min.css"><link rel="stylesheet" href="../style.css"><style>button{background-image:url(../assets/button.png)}body{background-image:url(../assets/background.png)}</style></head><body><header><div><a class="home" href="https://math-game-arcade.vercel.app/">수학 아틀리에 ↗</a><h1>나의 여행 노트</h1></div><a href="../">윈드 리프로 돌아가기</a></header><main class="notes"><label>내 노트<select id="profiles" aria-label="내 노트 선택"></select></label><button id="new-profile">새 노트 시작</button><nav id="tasks"></nav><section><h2 id="title"></h2><p id="prompt"></p><div id="math"></div><div id="diagram"></div><form id="answer-form"><div id="inputs"></div><div id="graph"></div><label>어떻게 생각했나요?<textarea id="explanation" aria-label="나의 설명"></textarea></label><button type="button" id="help">힌트 보기</button><button type="submit">생각 남기기</button><button type="button" id="retry">다시 해보기</button></form><p id="feedback" role="status"></p></section><section><h2>내가 해 본 것</h2><div id="report"></div><details><summary>생각의 발자취</summary><div id="history"></div></details><label>함께 읽고 남긴 말<textarea id="review" aria-label="피드백"></textarea></label><button id="save-review">말 저장하기</button><span id="review-status" role="status"></span><button id="export">여행 노트 저장</button><button id="print">인쇄하기</button></section></main><script type="module" src="app.mjs"></script></body></html>
